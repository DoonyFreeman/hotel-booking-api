services:
  booking_db:
    container_name: booking_db
    image: postgres:16
    ports:
      - "6432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg-booking-data:/var/lib/postgresql/data
    networks:
      - my-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  booking_cache:
    container_name: booking_cache
    image: redis:7.4
    ports:
      - "7379:6379"
    networks:
      - my-network

  booking_back_service:
    container_name: 'booking_back'
    build:
      context: .
    ports:
      - "7777:8000"
    networks:
      - my-network
    env_file:
      - .env
    depends_on:
      booking_db:
        condition: service_healthy
      booking_cache:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  booking_celery_worker_service:
    container_name: 'booking_celery_worker'
    build:
      context: .
    networks:
      - my-network
    env_file:
      - .env
    command:  "celery --app=src.tasks.celery_app:celery_instance worker -l INFO"
    depends_on:
      booking_db:
        condition: service_healthy
      booking_cache:
        condition: service_started

  booking_celery_beat_service:
    container_name: 'booking_celery_beat'
    build:
      context: .
    networks:
      - my-network
    env_file:
      - .env
    command: "celery --app=src.tasks.celery_app:celery_instance beat -l INFO"
    depends_on:
      booking_db:
        condition: service_healthy
      booking_cache:
        condition: service_started

  booking_nginx:
    container_name: booking_nginx
    image: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      - my-network
    depends_on:
      - booking_back_service

  prometheus:
    container_name: booking_prometheus
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - my-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  grafana:
    container_name: booking_grafana
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - my-network
    depends_on:
      - prometheus

  postgres_exporter:
    container_name: booking_pg_exporter
    image: prometheuscommunity/postgres-exporter
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_URI: "booking_db:5432/booking?sslmode=disable"
      DATA_SOURCE_USER: ${DB_USER}
      DATA_SOURCE_PASS: ${DB_PASS}
    networks:
      - my-network
    depends_on:
      - booking_db

  redis_exporter:
    container_name: booking_redis_exporter
    image: oliver006/redis_exporter
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis://booking_cache:6379"
    networks:
      - my-network
    depends_on:
      - booking_cache

  nginx_exporter:
    container_name: booking_nginx_exporter
    image: nginx/nginx-prometheus-exporter
    ports:
      - "9113:9113"
    command:
      - '--nginx.scrape-uri=http://booking_nginx:80/nginx-status'
    networks:
      - my-network
    depends_on:
      - booking_nginx

volumes:
  pg-booking-data:
  prometheus-data:
  grafana-data:

networks:
  my-network: